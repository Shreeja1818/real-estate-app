<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HomeFinder - Real Estate Listings</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

 
  <header class="navbar">
    <h1 class="logo">🏠 HomeFinder</h1>
    <button id="showFavorites" class="nav-btn">❤️ Saved (<span id="favCount">0</span>)</button>
  </header>

  
  <section class="hero">
    <h2>Find Your Dream Property</h2>
    <input type="text" id="searchInput" placeholder="Search by city or title...">
  </section>

  
  <section class="filters">
    <select id="typeFilter">
      <option value="all">All Types</option>
      <option value="house">House</option>
      <option value="apartment">Apartment</option>
      <option value="villa">Villa</option>
      <option value="plot">Plot</option>
    </select>

    <select id="purposeFilter">
      <option value="all">Buy / Rent</option>
      <option value="sale">For Sale</option>
      <option value="rent">For Rent</option>
    </select>

    <select id="sortSelect">
      <option value="default">Sort By</option>
      <option value="low">Price: Low to High</option>
      <option value="high">Price: High to Low</option>
    </select>
  </section>

 
  <main>
    <p id="resultCount"></p>
    <div id="propertyGrid" class="grid"></div>
  </main>
     
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <button id="closeModal" class="close-btn">✖</button>
      <div id="modalContent"></div>
    </div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
